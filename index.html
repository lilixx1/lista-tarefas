
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas tarefas ♡</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Minhas tarefas ♡</h1>
    <p class="subtitulo">Organize seu dia com carinho.</p>

    <div class="container">
        <div class="campo-adicionar">
            <input
                type="text"
                id="campoTarefa"
                placeholder="Digite uma tarefa..."
                maxlength="150"
            >
            <button id="botaoAdicionar">Adicionar</button>
        </div>

        <ul id="listaTarefas"></ul>

        <p id="contador">Tarefas pendentes: 0</p>
        <p class="rodape">Um passinho de cada vez ♡</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
